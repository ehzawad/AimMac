# Generates AimMac.xcodeproj with XcodeGen:
#   brew install xcodegen
#   cd Apple && xcodegen
# Then open AimMac.xcodeproj and run. Signing settings live in Config.xcconfig.

name: AimMac
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "5"

targets:
  AimMac:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: ../Shared
      - path: Assets.xcassets
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Orbit Pointer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Orbit Pointer connects to your Mac over Bluetooth so your iPhone can act as its trackpad and keyboard.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).aimmac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
